# Minimal, deliberately narrow rule set for the CI lint gate (see .github/workflows/ci.yml).
# E4/E7/E9: syntax-level errors (undefined names, bad control flow, etc.) - never worth debating.
# F: pyflakes (unused imports/variables, undefined names).
# This project does not enforce a broader style guide (import sorting, docstrings,
# datetime-timezone-awareness, etc.) - those are judgment calls outside this assignment's scope.
line-length = 120

[lint]
select = ["E4", "E7", "E9", "F"]
