name: telecom-network-analytics

# Every image tag is pinned (no `latest`). Every long-running service has a healthcheck.
# All host ports are bound to 127.0.0.1 only.

x-airflow-common: &airflow-common
  build:
    context: ./airflow
    dockerfile: Dockerfile
  image: telecom-airflow:2.10.2-dbt1.8.7
  environment: &airflow-common-env
    AIRFLOW__WEBSERVER__WORKERS: "1"
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: "1" 
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres-airflow:5432/${AIRFLOW_DB_NAME}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW_CONN_TELECOM_POSTGRES: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    AIRFLOW_CONN_SOURCE_POSTGRES: postgresql://${SOURCE_POSTGRES_USER}:${SOURCE_POSTGRES_PASSWORD}@postgres-source:5432/${SOURCE_POSTGRES_DB}
    # Internal (docker-network) hostnames: the .env values are localhost-based, for host tools only.
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_USER: ${POSTGRES_USER}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    POSTGRES_DB: ${POSTGRES_DB}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    RUSTFS_ENDPOINT_URL: http://rustfs:9000
    RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
    RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    RUSTFS_RAW_BUCKET: ${RUSTFS_RAW_BUCKET}
    SPARK_MASTER_URL: spark://spark-master:7077
    # dbt runs from a bind-mounted dir the airflow user may not own -> write artifacts to /tmp.
    DBT_TARGET_PATH: /tmp/dbt/target
    DBT_LOG_PATH: /tmp/dbt/logs
    DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    PYTHONPATH: /opt/airflow/project
  volumes:
    - ../orchestration/dags:/opt/airflow/dags:ro
    - ../ingestion:/opt/airflow/project/ingestion:ro
    - ../config:/opt/airflow/project/config:ro
    - ../transformation:/opt/airflow/project/transformation
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres-airflow:
      condition: service_healthy
  networks:
    - telecom-net

services:
  # ---------------------------------------------------------------- databases
  postgres-source:
    image: postgres:16.4
    container_name: telecom-postgres-source
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_replication_slots=4", "-c", "max_wal_senders=4"]
    environment:
      POSTGRES_USER: ${SOURCE_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOURCE_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOURCE_POSTGRES_DB}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-source-data:/var/lib/postgresql/data
      - ./postgres-source/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SOURCE_POSTGRES_USER} -d ${SOURCE_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telecom-net

  postgres:
    image: postgres:16.4
    container_name: telecom-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telecom-net

  postgres-airflow:
    image: postgres:16.4
    container_name: telecom-airflow-postgres
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    volumes:
      - postgres-airflow-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - telecom-net

  # ---------------------------------------------------------------- streaming
  kafka:
    image: apache/kafka:3.8.0
    container_name: telecom-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:19092,CONTROLLER://0.0.0.0:19093,EXTERNAL://0.0.0.0:9092
      # PLAINTEXT = docker-network clients (kafka-connect, kafka-ui, airflow); EXTERNAL = host tools
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # single-node broker: every internal topic must use replication factor / min ISR = 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      # keep the log on the named volume; the image default may point at /tmp
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - telecom-net

  kafka-connect:
    image: debezium/connect:2.7.3.Final
    container_name: telecom-kafka-connect
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      BOOTSTRAP_SERVERS: kafka:19092
      HEAP_OPTS: "-Xms256m -Xmx768m"
      GROUP_ID: telecom-connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
    depends_on:
      kafka:
        condition: service_healthy
      postgres-source:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
    networks:
      - telecom-net

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: telecom-kafka-ui
    ports:
      - "127.0.0.1:8085:8080"
    environment:
      JAVA_OPTS: "-Xms128m -Xmx384m"
      KAFKA_CLUSTERS_0_NAME: telecom-network-analytics
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: telecom-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083
      DYNAMIC_CONFIG_ENABLED: "true"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      # wget is present in the image (busybox); the actuator endpoint answers once the app is up
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - telecom-net

  # ---------------------------------------------------------------- object storage
  rustfs:
    image: rustfs/rustfs:1.0.0
    container_name: telecom-rustfs
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - rustfs-data:/data
    healthcheck:
      # /health is RustFS's documented probe; /health/live is tried as a fallback.
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/health || curl -fs http://localhost:9000/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - telecom-net

  # ---------------------------------------------------------------- batch compute
  spark-master:
    image: bitnamilegacy/spark:3.5.3
    container_name: telecom-spark-master
    environment:
      SPARK_MODE: master
      SPARK_WORKER_MEMORY: 512M
      SPARK_DAEMON_MEMORY: 256m
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    ports:
      - "127.0.0.1:7077:7077"
      - "127.0.0.1:8081:8080"
    volumes:
      - ../transformation/spark_jobs:/opt/spark-apps
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - telecom-net

  spark-worker:
    image: bitnamilegacy/spark:3.5.3
    container_name: telecom-spark-worker
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 512M
      SPARK_WORKER_CORES: 1
      SPARK_DAEMON_MEMORY: 256m
      SPARK_RPC_AUTHENTICATION_ENABLED: "no"
      SPARK_RPC_ENCRYPTION_ENABLED: "no"
    volumes:
      - ../transformation/spark_jobs:/opt/spark-apps
    depends_on:
      spark-master:
        condition: service_healthy
    healthcheck:
      # worker web UI listens on 8081 inside the container
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081')\" || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s
    networks:
      - telecom-net

  # ---------------------------------------------------------------- orchestration
  airflow-init:
    <<: *airflow-common
    container_name: telecom-airflow-init
    entrypoint: /bin/bash
    # Idempotent on purpose: `down` + `up` re-runs this container against a persisted
    # metadata DB, and `airflow users create` fails when the user already exists.
    command:
      - -c
      - |
        airflow db migrate &&
        (airflow users list | grep -qw "${AIRFLOW_ADMIN_USER}" ||
         airflow users create \
           --username "${AIRFLOW_ADMIN_USER}" \
           --password "${AIRFLOW_ADMIN_PASSWORD}" \
           --firstname Admin \
           --lastname User \
           --role Admin \
           --email admin@example.com)

  airflow-webserver:
    <<: *airflow-common
    container_name: telecom-airflow-webserver
    command: webserver
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    container_name: telecom-airflow-scheduler
    command: scheduler
    healthcheck:
      test: ["CMD-SHELL", "airflow jobs check --job-type SchedulerJob --hostname \"$${HOSTNAME}\""]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 30s
    depends_on:
      airflow-init:
        condition: service_completed_successfully

networks:
  telecom-net:
    driver: bridge

# Named volumes: state survives `docker compose down`; only `down -v` deletes it.
volumes:
  postgres-source-data:
  postgres-data:
  postgres-airflow-data:
  kafka-data:
  rustfs-data:
  airflow-logs:
